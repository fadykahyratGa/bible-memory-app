name: bible_memory_app
description: "Kids Bible memory app in Arabic using Supabase"
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter: 
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.5.5
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  google_fonts: ^6.2.1
  http: ^1.2.2

  # Cupertino icons for iOS style icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/
